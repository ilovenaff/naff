<!doctype html>
<html lang="en">
<head>
  <link
    rel="shortcut icon"
    type="image/x-icon"
    href="purplestar.png"
  >

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Open the NAFF application menu"
  >

  <title>NAFF</title>

 <link rel="stylesheet" href="styles.css?v=cursor-fix-1">
</head>

<body>
  <main class="artboard-screen">
    <div class="artboard">
      <picture>
        <source
          media="(max-width: 700px)"
          srcset="assets/mobile/closed-box.png"
        >

        <img
          class="artboard-image"
          src="assets/desktop/closed-box.png"
          alt="Closed decorated NAFF box"
        >
      </picture>
    </div>

    <a
      class="whole-screen-link"
      href="menu.html"
      aria-label="Open the NAFF box"
    ></a>
  </main>
</body>
</html>
