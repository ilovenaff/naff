<!doctype html>
<html lang="en">
<head>
  <link
    rel="shortcut icon"
    type="image/x-icon"
    href="purplestar.png"
  >

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Open the NAFF application box"
  >

  <title>NAFF</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: white;
    }

    .box-stage {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: white;
    }

    .box-canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      line-height: 0;
      transform: translate(-50%, -50%);
    }

    .box-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .box-canvas--desktop {
      width: min(100vw, calc(100svh * 1544 / 967));
      aspect-ratio: 1544 / 967;
    }

    .box-canvas--mobile {
      display: none;
    }

    .open-box-link {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: block;
      background: transparent;
      text-decoration: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 700px) {
      .box-canvas--desktop {
        display: none;
      }

      .box-canvas--mobile {
        display: block;

        /*
          Same mobile sizing and centering approach
          as the open-box page.
        */
        width: 128vw;
        aspect-ratio: 960 / 1664;
      }
    }
  </style>
</head>

<body>
  <main class="box-stage">

    <!-- Desktop closed box -->

    <div class="box-canvas box-canvas--desktop">
      <img
        class="box-image"
        src="assets/desktop/closed-box.png"
        alt="Closed decorated NAFF box"
      >
    </div>

    <!-- Mobile closed box -->

    <div class="box-canvas box-canvas--mobile">
      <img
        class="box-image"
        src="assets/mobile/closed-box.png"
        alt="Closed decorated NAFF box"
      >
    </div>

    <a
      class="open-box-link"
      href="menu.html"
      aria-label="Open the NAFF box"
    ></a>
  </main>

  <script src="cursor.js?v=cursor-6"></script>
</body>
</html>
