<!doctype html>
<html lang="en">
<head>
  <link
    rel="shortcut icon"
    type="image/x-icon"
    href="purplestar.png"
  >

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="NAFF role descriptions"
  >

  <title>NAFF Role Descriptions</title>

</head>

<body>
  <main class="roles-document">

    <!-- Desktop version -->

    <div class="roles-desktop">
      <section
        class="role-section"
        aria-label="Introduction to NAFF roles"
      >
        <img
          class="role-image"
          src="assets/desktop/role-descriptions.png"
          alt="Introduction to NAFF role descriptions"
        >
      </section>

      <section
        class="role-section role-section--creative"
        aria-label="NAFF creative roles"
      >
        <img
          class="role-image"
          src="assets/desktop/creative-roles.png"
          alt="NAFF creative role descriptions"
        >
      </section>

      <section
        class="role-section role-section--administrative"
        aria-label="NAFF administrative roles"
      >
        <img
          class="role-image"
          src="assets/desktop/administrative-roles.png"
          alt="NAFF administrative role descriptions"
        >
      </section>
    </div>


    <!-- Mobile version -->

    <div class="roles-mobile">
      <section
        class="mobile-role-section"
        aria-label="NAFF role descriptions and creative roles"
      >
        <img
          class="mobile-role-image"
          src="assets/mobile/roles-creative.png"
          alt="NAFF role descriptions and creative role descriptions"
        >
      </section>

      <section
        class="mobile-role-section"
        aria-label="NAFF administrative roles"
      >
        <img
          class="mobile-role-image"
          src="assets/mobile/administrative-roles.png"
          alt="NAFF administrative role descriptions"
        >
      </section>
    </div>

  </main>
  <link rel="stylesheet" href="styles.css?v=cursor-6">
<script src="cursor.js?v=cursor-6"></script>
</body>
</html>
