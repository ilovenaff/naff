<!doctype html>
<html lang="en">
<head>
  <link
    rel="shortcut icon"
    type="image/x-icon"
    href="purplestar.png"
  >

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="NAFF information, roles and application form"
  >

  <title>NAFF Menu</title>

</head>

<body class="debug-hotspots">
  
  <main class="artboard-screen">
    <div class="artboard">
      <picture>
        <source
          media="(max-width: 700px)"
          srcset="assets/mobile/open-box.png"
        >

        <img
          class="artboard-image"
          src="assets/desktop/open-box.png"
          alt="Open decorated NAFF box containing the website menu"
        >
      </picture>

      <a
        class="menu-hotspot menu-hotspot--info"
        href="info.html"
        aria-label="Read ten fun facts about NAFF"
      >
        <span class="visually-hidden">Info</span>
      </a>

      <a
        class="menu-hotspot menu-hotspot--roles"
        href="roles.html"
        aria-label="Read the NAFF role descriptions"
      >
        <span class="visually-hidden">
          Role descriptions
        </span>
      </a>

      <a
        class="menu-hotspot menu-hotspot--application"
        href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=yyZW-KgN00mqWGTvZ47wGt9AFYVmMq5OkfHVRCCSDN5UMjBPTkYxQ042MldQVUlTVkRGWDZONkxWUi4u"
        aria-label="Open the NAFF application form"
      >
        <span class="visually-hidden">
          Application form
        </span>
      </a>
    </div>
  </main>
  <script src="cursor.js?v=cursor-3"></script>
  <link rel="stylesheet" href="styles.css?v=cursor-3">
</body>
</html>
